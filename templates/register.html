{% extends "base.html" %}

{% block title %}{{ _('إنشاء حساب - المولّد الذكي للاختبارات') }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus"></i>
            <h1>{{ _('إنشاء حساب جديد') }}</h1>
            <p>{{ _('انضم إلينا وابدأ في توليد اختباراتك الذكية') }}</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="full_name">
                    <i class="fas fa-id-card"></i>
                    {{ _('الاسم الكامل') }}
                </label>
                <input 
                    type="text" 
                    id="full_name" 
                    name="full_name" 
                    class="form-input" 
                    placeholder="{{ _('أدخل اسمك الكامل') }}"
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i>
                    {{ _('اسم المستخدم') }}
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input" 
                    placeholder="{{ _('اختر اسم مستخدم') }}"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i>
                    {{ _('البريد الإلكتروني') }}
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    placeholder="{{ _('example@domain.com') }}"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    {{ _('كلمة المرور') }}
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="{{ _('أدخل كلمة مرور قوية') }}"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-user-plus"></i>
                <span>{{ _('إنشاء الحساب') }}</span>
            </button>
        </form>

        <div class="auth-link">
            {{ _('لديك حساب بالفعل؟') }} 
            <a href="{{ url_for('login') }}">{{ _('سجّل دخولك') }}</a>
        </div>
    </div>
</div>
{% endblock %}
