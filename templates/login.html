{% extends "base.html" %}

{% block title %}{{ _('تسجيل الدخول - المولّد الذكي للاختبارات') }}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-sign-in-alt"></i>
            <h1>{{ _('مرحباً بعودتك') }}</h1>
            <p>{{ _('سجّل دخولك للوصول إلى حسابك') }}</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i>
                    {{ _('اسم المستخدم') }}
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input" 
                    placeholder="{{ _('أدخل اسم المستخدم') }}"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>
                    {{ _('كلمة المرور') }}
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="{{ _('أدخل كلمة المرور') }}"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fas fa-sign-in-alt"></i>
                <span>{{ _('تسجيل الدخول') }}</span>
            </button>
        </form>

        <div class="auth-link">
            {{ _('ليس لديك حساب؟') }} 
            <a href="{{ url_for('register') }}">{{ _('سجّل الآن') }}</a>
        </div>
    </div>
</div>
{% endblock %}
